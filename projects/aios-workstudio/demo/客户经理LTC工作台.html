function $(s){return document.querySelector(s)}
function fmtMoney(v,unit){return (unit==='USD'?'$':'')+Math.round(v).toLocaleString()}
function fmtPct(v){return (v*100).toFixed(1)+'%'}
function fmtDelta(v,pp){return pp?`↑${v.toFixed(1)}pp`:(v>=0?`↑${(v*100).toFixed(1)}%`:`↓${Math.abs(v*100).toFixed(1)}%`)}
function renderKPI(){
  const g=DATA.global_kpi;
  document.getElementById('hdrNote').textContent=`数据周期：${DATA.meta.data_period} · 视角：${DATA.meta.view_cm}`;
  const adopLow = g.adoption.value < g.adoption.peer_p50;
  document.getElementById('kpiStrip').innerHTML=`
    <div class="ktile kt1 composite">
      <div class="kt-comp-head">💼 经营概览 <b>Spend / Margin / SOM / Adoption</b><span class="section-note" style="margin-left:auto">近30天</span></div>
      <div class="km-grid">
        <div class="km"><div class="km-l">Spend <span class="km-tip">消耗</span></div><div class="km-v">${fmtMoney(g.spend.value,g.spend.unit)}</div><div class="km-sub ${g.spend.mom>=0?'up':'down'}">${fmtDelta(g.spend.mom)}</div></div>
        <div class="km"><div class="km-l">Margin <span class="km-tip">利润</span></div><div class="km-v">${fmtMoney(g.margin.value,g.margin.unit)}</div><div class="km-sub ${g.margin.mom>=0?'up':'down'}">${fmtDelta(g.margin.mom)}</div></div>
        <div class="km"><div class="km-l">SOM <span class="km-tip">市场份额</span></div><div class="km-v">${fmtPct(g.som.value)}</div><div class="km-sub ${g.som.mom_pp>=0?'up':'down'}">${g.som.mom_pp>=0?'↑':'↓'}${Math.abs(g.som.mom_pp).toFixed(1)}pp</div></div>
        <div class="km"><div class="km-l">Adoption <span class="km-tip">服务项采纳</span></div><div class="km-v">${g.adoption.value}</div><div class="km-sub ${adopLow?'down':'up'}">${adopLow?'低于P50':'高于P50'}</div></div>
      </div>
    </div>
    ${taskQueueHTML()}`;
}
function buildTaskQueue(){
  const q={P0:[],P1:[],P2:[]};
  filteredCustomers().forEach(c=>{
    const sb=c.stages[c.current_stage];
    if(!sb||!sb.actions)return;
    sb.actions.forEach(a=>{if(q[a.p])q[a.p].push({p:a.p,text:a.text,owner:a.owner,collab:a.collab,cust:c.customer_name,uec:c.customer_uec,health:c.health})});
  });
  return q;
}
function taskQueueHTML(){
  const q=buildTaskQueue();
  const cols=[['P0','重要紧急'],['P1','重要不紧急'],['P2','紧急不重要']];
  const total=q.P0.length+q.P1.length+q.P2.length;
  const colHTML=([p,label])=>{
    const items=q[p];
    const list=items.map(it=>`<div class="pq-item ${p}" onclick="selectCustomer('${it.uec}')" title="跳转到 ${it.cust}"><div class="pq-itxt">${it.text}</div><div class="pq-imeta"><span class="pq-icust ${it.health==='gate'?'g':''}">${it.cust}</span><span class="pq-iowner">${it.owner}${it.collab?'·'+it.collab:''}</span></div></div>`).join('');
    return `<div class="pq-col"><div class="pq-colhead"><span class="pq-badge ${p}">${p}</span><span class="pq-clabel">${label}</span><span class="pq-ccnt">${items.length}</span></div><div class="pq-list">${list||'<div class="pq-empty">无任务</div>'}</div></div>`;
  };
  return `<div class="ktile tasks"><div class="kt-tasks-head">📋 行动队列 <b>P0·P1·P2</b><span class="section-note" style="margin-left:auto">${total} 项 · 按筛选客户当前阶段聚合 · 点击跳转客户</span></div><div class="pq-cols">${cols.map(colHTML).join('')}</div></div>`;
}
function exportCSV(){
  const fc=filteredCustomers();
  const headers=['customer_uec','customer_name','current_stage','days_in_stage','owner_cm','owner_bd','health','signal_summary'];
  const rows=fc.map(c=>headers.map(h=>`"${(c[h]??'')}"`).join(','));
  const csv='﻿'+[headers.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CM_LTC_工作台.csv';a.click();
}
let FILTERS={stage:null,status:'',q:''};
function filteredCustomers(){
  return DATA.customers.filter(c=>{
    if(FILTERS.stage && c.current_stage!==FILTERS.stage) return false;
    if(FILTERS.status && c.health!==FILTERS.status) return false;
    if(FILTERS.q){const n=(c.customer_name+c.customer_uec).toLowerCase();if(!n.includes(FILTERS.q.toLowerCase()))return false}
    return true;
  });
}
function renderFunnel(){
  const fc=filteredCustomers();
  const counts={};DATA.funnel.forEach(f=>counts[f.stage]=0);
  fc.forEach(c=>counts[c.current_stage]=(counts[c.current_stage]||0)+1);
  document.getElementById('funnel').innerHTML=DATA.funnel.map(f=>{
    const sel=FILTERS.stage===f.stage?'sel':'';
    return `<div class="fp ${f.gate?'gate':''} ${sel}" onclick="toggleStage('${f.stage}')"><div class="fp-num">${f.stage.slice(0,2)}</div><div class="fp-name">${f.stage.slice(3)}</div><div class="fp-cnt">${counts[f.stage]||0}</div></div>`;
  }).join('');
}
function toggleStage(s){FILTERS.stage=FILTERS.stage===s?null:s;renderAll()}
function resetFilter(){FILTERS={stage:null,status:'',q:''};document.getElementById('fQ').value='';document.getElementById('fStatus').value='';renderAll()}
['fQ','fStatus'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{FILTERS.q=document.getElementById('fQ').value;FILTERS.status=document.getElementById('fStatus').value;renderAll()}));
function renderAll(){renderKPI();renderFunnel();renderList();renderDetail()}
let SEL_UEC=null;
function tagLabel(h){return h==='gate'?'卡口':h==='warn'?'预警':'正常'}
function renderList(){
  const fc=filteredCustomers();
  if(!SEL_UEC || !fc.find(c=>c.customer_uec===SEL_UEC)) SEL_UEC=fc[0]?.customer_uec||null;
  const cnt=fc.length;
  const stageTxt=FILTERS.stage?`${FILTERS.stage} 阶段`:'全部';
  document.getElementById('workbench').innerHTML=`<div class="workbench"><div class="clist"><div class="clist-head"><span class="clist-title">客户列表</span><span class="clist-cnt">${cnt} 条 · ${stageTxt}</span></div><div class="clist-body">${fc.map(c=>{
    const sel=c.customer_uec===SEL_UEC?'sel':'';
    const days=c.days_in_stage?`停留 ${c.days_in_stage}天`:'稳态';
    return `<div class="crow ${c.health} ${sel}" onclick="selectCustomer('${c.customer_uec}')"><div class="cr-top"><span class="cr-name">${c.customer_name}</span><span class="cr-tag ${c.health}">${tagLabel(c.health)}</span></div><div class="cr-mid"><span class="cr-stage">${c.current_stage}</span><span>${c.owner_cm?'CM·'+c.owner_cm:''}</span></div><div class="cr-bot"><span class="cr-days ${c.health==='gate'?'gate':''}">${days}</span><span class="cr-sig">${c.signal_summary}</span></div></div>`;
  }).join('')||'<div style="padding:20px;text-align:center;color:var(--text-light)">无匹配客户</div>'}</div></div><div id="detailSlot"></div></div>`;
  renderDetail();
}
function selectCustomer(uec){SEL_UEC=uec;renderList();renderDetail()}
let VIEW_STAGE=null;
function renderDetail(){
  const slot=document.getElementById('detailSlot');if(!slot)return;
  const c=DATA.customers.find(x=>x.customer_uec===SEL_UEC);
  if(!c){slot.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-light)">选择左侧客户查看详情</div>';return}
  const stage=VIEW_STAGE||c.current_stage;
  const sb=c.stages[stage];
  if(!sb){slot.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-light)">该客户在 ${stage} 无快照数据</div>`;return}
  const v=sb.verdict;
  const d=sb.data;
  const tabs=STAGES.map(s=>`<span class="stab ${s===stage?'active':''}" onclick="setViewStage('${s}')">${s.slice(3)}</span>`).join('');
  const dEntries=Object.entries(d).filter(([k])=>k!=='trend');
  const dtiles=dEntries.map(([k,val])=>`<div class="dtile"><div class="dtile-l">${fieldLabel(k)}</div><div class="dtile-v">${fmtFieldVal(k,val)}</div></div>`).join('');
  const trend=d.trend||[];
  const spark=trend.length>=2?sparkSVG(trend.map(t=>t.value),30):'';
  const acts=sb.actions.map(a=>`<div class="act ${a.p}"><span class="act-tag ${a.p}">${a.p}</span><div><div class="act-txt">${a.text}</div><div class="act-owner">负责人：${a.owner}${a.collab?' · 协作：'+a.collab:''}</div></div></div>`).join('');
  const rows=sb.plan.map(p=>`<tr><td>${p.task}</td><td>${p.owner}</td><td class="mono">${p.due}</td><td><span class="pbadge" style="background:rgba(239,68,68,0.12);color:#dc2626">${p.p}</span></td><td><span class="pbadge ${p.status}">${statusLabel(p.status)}</span></td></tr>`).join('');
  slot.innerHTML=`<div class="detail"><div class="detail-head"><div class="detail-title">${c.customer_name}</div><div class="detail-sub">CM: ${c.owner_cm} · BD: ${c.owner_bd} · ${stage} ${stage===c.current_stage?`· 进入 ${c.days_in_stage} 天`:''} · 编码 ${c.customer_uec}</div><div class="stage-tabs">${tabs}</div></div><div class="detail-body">
    <div class="verdict ${v.level==='ok'?'':v.level}"><div class="verdict-title">${v.title}</div><div class="verdict-desc">${v.desc}</div></div>
    <div class="dblock"><div class="db-h">📊 数据看板</div><div class="dgrid">${dtiles}</div>${spark?`<div style="margin-top:8px"><div style="font-size:10px;color:var(--text-light);margin-bottom:4px">趋势</div>${spark}</div>`:''}</div>
    <div class="dblock"><div class="db-h">🎯 行动策略</div>${acts||'<div style="color:var(--text-light)">无行动项</div>'}</div>
    <div class="dblock"><div class="db-h">📝 计划跟踪</div><table class="ptable"><thead><tr><th>任务</th><th>负责人</th><th>截止</th><th>优先级</th><th>状态</th></tr></thead><tbody>${rows||'<tr><td colspan=5>无任务</td></tr>'}</tbody></table></div>
  </div></div>`;
}
function setViewStage(s){VIEW_STAGE=(s===(DATA.customers.find(c=>c.customer_uec===SEL_UEC)||{}).current_stage)?null:s;renderDetail()}
function fieldLabel(k){return {visit_count:'拜访次数',last_visit:'最近拜访',last_visit_days:'最近拜访(天前)',attendee_level:'到场级别',avg_duration_min:'平均时长',connect_rate:'建联率',minutes_done:'纪要完成',unconfirmed_req_count:'未确认需求',approval_status:'审批状态',contract_amount:'合同金额',credit_usage_rate:'授信使用率',qual_ready:'资质齐备',setup_progress:'搭建进度',launch_spend:'首跑Spend',roi:'ROI',churn_risk:'流失风险',health_trend:'健康趋势',open_tickets:'工单',lead_pool_count:'线索池',high_score_stale_days:'高分滞留(天)'}[k]||k}
function fmtFieldVal(k,v){if(typeof v==='boolean')return v?'是':'否';if(k==='avg_duration_min')return v+'min';if(k==='contract_amount'||k==='launch_spend')return '$'+Number(v).toLocaleString();if(k==='connect_rate'||k==='credit_usage_rate'||k==='roi')return (v*100).toFixed(1)+'%';if(k==='setup_progress')return (v*100)+'%';return String(v)}
function statusLabel(s){return {todo:'待执行',doing:'进行中',done:'已完成',overdue:'逾期'}[s]||s}
function sparkSVG(vals,h){const w=300,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-mn)/r)*(h-4)-2}`);return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs><path d="M${pts.join(' L')}" fill="none" stroke="#3b82f6" stroke-width="2"/><path d="M${pts.join(' L')} L${w},${h} L0,${h}Z" fill="url(#sg)"/></svg>`}
document.getElementById('hdrTime').textContent='2026-08-21 09:30';

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c3224">
  <title>LifeWake · 时空记忆匣</title>
  <meta name="description" content="记忆宫殿、智能百宝箱与时空穿梭机三位一体原型">
  <link rel="stylesheet" href="memory-chest.css">
</head>
<body>
  <a class="skip-link" href="#stage">进入记忆匣</a>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="product-kicker">LifeWake Memory P1</div>
        <h1 id="product-title">时空记忆匣</h1>
        <p class="lede" id="slogan">以记忆筑宫殿，以万物为宝箱，以道具穿时空，人人皆为自己故事的造物主。</p>
      </div>
      <nav class="nav-links" aria-label="产品空间">
        <a href="index.html">返回情景桌面</a>
        <span class="chip">私有 · 可撤回 · 原点只读</span>
      </nav>
    </header>

    <div class="views" role="tablist" aria-label="三视图">
      <button type="button" id="view-palace" aria-pressed="true">记忆宫殿</button>
      <button type="button" id="view-chest" aria-pressed="false">智能百宝箱</button>
      <button type="button" id="view-shuttle" aria-pressed="false">时空穿梭</button>
    </div>

    <main id="stage" class="grid">
      <section class="panel" id="primary-panel">
        <h2 id="primary-title">记忆宫殿</h2>
        <p class="hint" id="primary-hint">四层私有空间。高权重信物会在对应翼里长出专属锚点，不会全量重建宫殿。</p>
        <div id="palace-root"></div>
        <div id="chest-root" hidden></div>
        <div id="shuttle-root" hidden>
          <div class="mode-switch">
            <label><input type="radio" name="mode" value="relive" checked> 重温原始（只读）</label>
            <label><input type="radio" name="mode" value="rewrite"> 开启新平行分支</label>
          </div>
          <div class="scene-stage" id="scene-stage">
            <div class="eyebrow" id="scene-kicker">选择一件道具</div>
            <h3 id="scene-title">尚未穿梭</h3>
            <p id="scene-opening">点击百宝箱中的信物、卷轴或罗盘。道具携带完整溯源码，是进入故事的物理锚点。</p>
          </div>
          <div class="actions">
            <button type="button" id="shuttle-trigger">穿梭进入</button>
            <button type="button" class="ghost" id="capture-trigger">抓取当前片段</button>
            <button type="button" class="ghost" id="fuse-trigger">融合发卡 × 罗盘</button>
          </div>
          <p class="warning" id="mode-warning">重温不会改写原始记忆。改写将复制子图，原点完整保留。</p>
        </div>
      </section>
      <aside class="panel" id="side-panel">
        <h2>溯源与资产</h2>
        <p class="hint">每件道具都带时空溯源码。真实记忆与幻想创作分层隔离。</p>
        <div id="item-detail"></div>
        <ol class="log" id="event-log" aria-live="polite"></ol>
      </aside>
    </main>
  </div>
  <script src="memory-chest.js"></script>
</body>
</html>
